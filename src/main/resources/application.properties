# ======================================
# HelpLink - Configuração Spring Boot
# Tokens serão substituídos no Azure Pipeline
# ======================================

# Configuração do Servidor
server.port=8080
spring.application.name=helplink

# Configuração do Banco de Dados Oracle
spring.datasource.url=#{urlConnectionDB}#
spring.datasource.username=#{userDb}#
spring.datasource.password=#{passwordDb}#
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pool de Conexões
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Actuator (para health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized